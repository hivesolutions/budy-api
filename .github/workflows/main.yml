name: Main Workflow
on: [push]
jobs:
  build:
    name: Build
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          2.7,
          3.5,
          3.6,
          3.7,
          3.8,
          3.9,
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          latest
        ]
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting
        if: matrix.python-version == '3.14'
        run: |
          pip install black
          black . --check

      - name: Run tests
        run: |
          pip install pytest
          pytest

      - name: Run setup tests
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: python setup.py test

  build-pypy:
    name: Build PyPy
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [2.7, 3.6, 3.9, "3.10"]
    runs-on: ubuntu-latest
    container: pypy:${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show PyPy version
        run: pypy --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting
        if: matrix.python-version == '3.14'
        run: |
          pip install black
          black . --check

      - name: Run tests
        run: |
          pip install pytest
          pytest

      - name: Run setup tests
        if: ${{ !contains(fromJson('["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "latest"]'), matrix.python-version) }}
        run: pypy setup.py test
